apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: fruchi
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: migrate
          image: fruchi-backend:local
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "alembic upgrade head && python -m app.cli ensure-admin"]
          envFrom:
            - configMapRef: { name: fruchi-config }
            - secretRef: { name: fruchi-secret }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: storage-init
  namespace: fruchi
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: storage-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: storage-init
          image: fruchi-backend:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.cli", "init-storage"]
          envFrom:
            - configMapRef: { name: fruchi-config }
            - secretRef: { name: fruchi-secret }
