apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: fruchi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: fruchi-backend:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "worker"]
          envFrom:
            - configMapRef: { name: fruchi-config }
            - secretRef: { name: fruchi-secret }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
